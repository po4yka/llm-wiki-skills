name: Ecosystem refresh report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run validate
      - name: Generate offline ecosystem refresh scaffold
        run: npm run refresh:ecosystem-report
      - uses: actions/upload-artifact@v7
        with:
          name: ecosystem-refresh-report
          path: dist/ecosystem-refresh-report.md
          if-no-files-found: error
