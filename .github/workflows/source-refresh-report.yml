name: Source refresh report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run validate
      - name: Generate offline source refresh report
        run: npm run refresh:source-report
      - uses: actions/upload-artifact@v7
        with:
          name: source-refresh-report
          path: dist/source-refresh-report.md
          if-no-files-found: error
