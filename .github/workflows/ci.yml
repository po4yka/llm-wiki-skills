name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate skill files
        run: npm run validate:skills

      - name: Validate manifest and README catalog
        run: npm run validate:manifest

      - name: Validate local Markdown links
        run: npm run validate:links

      - name: Validate agent safety boundaries
        run: npm run validate:agent-safety

      - name: Generate release catalog
        run: npm run catalog:generate

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run markdownlint
        continue-on-error: true
        run: npm run lint:markdown

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run Gitleaks CLI
        continue-on-error: true
        run: |
          go install github.com/gitleaks/gitleaks/v8/cmd/gitleaks@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-git --redact --verbose

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run zizmor workflow audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install zizmor
          zizmor .github/workflows
