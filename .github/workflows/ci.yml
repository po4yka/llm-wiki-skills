name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run full validation suite
        run: npm run validate

      - name: Check skill version bumps
        if: github.event_name == 'pull_request'
        env:
          SKILL_VERSION_STRICT: '1'
          SKILL_VERSION_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "${SKILL_VERSION_BASE_REF}:${SKILL_VERSION_BASE_REF}" || true
          npm run check:skill-versions -- --strict

      - name: Generate catalogs
        run: npm run catalog:generate

      - name: Verify generated Markdown catalog is committed
        run: git diff --exit-code -- docs/skills-catalog.md

  distribution-smoke:
    name: Distribution smoke test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify local source works with skills CLI
        run: npm run smoke:skills

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run markdownlint
        continue-on-error: true
        run: npm run lint:markdown

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable

      - name: Run Gitleaks CLI
        continue-on-error: true
        run: |
          go install github.com/gitleaks/gitleaks/v8/cmd/gitleaks@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-git --redact --verbose

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Run zizmor workflow audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install zizmor
          zizmor .github/workflows
