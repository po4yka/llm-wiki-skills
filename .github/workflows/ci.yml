name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run full validation suite
        run: npm run validate

      - name: Check skill version bumps
        if: github.event_name == 'pull_request'
        env:
          SKILL_VERSION_STRICT: '1'
          SKILL_VERSION_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "${SKILL_VERSION_BASE_REF}:${SKILL_VERSION_BASE_REF}" || true
          npm run check:skill-versions -- --strict

      - name: Generate catalogs
        run: npm run catalog:generate

      - name: Verify generated catalog mirrors are committed
        run: git diff --exit-code -- docs/skills-catalog.md docs/07-skills-overview.md docs/00-index.md docs/skill-router.md

  distribution-smoke:
    name: Distribution smoke test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify local source works with skills CLI
        run: npm run smoke:skills

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run markdownlint
        continue-on-error: true
        run: npm run lint:markdown

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run Gitleaks CLI
        continue-on-error: true
        run: |
          go install github.com/gitleaks/gitleaks/v8/cmd/gitleaks@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-git --redact --verbose

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run zizmor workflow audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install zizmor==1.26.1
          zizmor .github/workflows
