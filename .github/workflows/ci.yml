name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run full validation suite
        run: npm run validate

      - name: Generate catalogs
        run: npm run catalog:generate

      - name: Verify generated Markdown catalog is committed
        run: git diff --exit-code -- docs/skills-catalog.md

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run markdownlint
        continue-on-error: true
        run: npm run lint:markdown

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run Gitleaks CLI
        continue-on-error: true
        run: |
          go install github.com/gitleaks/gitleaks/v8/cmd/gitleaks@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-git --redact --verbose

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run zizmor workflow audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install zizmor
          zizmor .github/workflows
