name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate skills pack
        run: npm run validate

      - name: Check skill version bumps
        env:
          SKILL_VERSION_STRICT: '1'
          SKILL_VERSION_BASE_REF: main
        run: |
          git fetch origin main:main || true
          npm run check:skill-versions -- --strict

      - name: Run distribution smoke test
        run: npm run smoke:skills

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Run Gitleaks CLI
        run: |
          go install github.com/gitleaks/gitleaks/v8/cmd/gitleaks@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-git --redact --verbose

      - name: Generate catalogs
        run: npm run catalog:generate

      - name: Generate release notes
        run: npm run release:notes -- "${GITHUB_REF_NAME}"

      - name: Build release archive
        run: |
          mkdir -p dist
          zip -r "dist/llm-wiki-skills-${GITHUB_REF_NAME}.zip" \
            README.md \
            LICENSE \
            CHANGELOG.md \
            skills.sh.json \
            package.json \
            scripts \
            skills \
            docs \
            templates \
            domain-packs \
            benchmarks \
            examples \
            -x 'docs/assets/originals/*'

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            dist/llm-wiki-skills-${{ github.ref_name }}.zip
            dist/skills-catalog.json
            dist/release-notes-${{ github.ref_name }}.md
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/llm-wiki-skills-${GITHUB_REF_NAME}.zip" \
            dist/skills-catalog.json \
            "dist/release-notes-${GITHUB_REF_NAME}.md" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "dist/release-notes-${GITHUB_REF_NAME}.md"
