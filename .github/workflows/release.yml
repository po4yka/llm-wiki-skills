name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate skills pack
        run: npm run validate

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Find previous release tag
        id: previous-release
        run: |
          current_tag=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            current_tag="${GITHUB_REF_NAME}"
          fi

          previous_tag=""
          while IFS= read -r candidate; do
            if [[ ! "${candidate}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              continue
            fi
            if [[ "${candidate}" == "${current_tag}" ]]; then
              continue
            fi
            previous_tag="${candidate}"
            break
          done < <(git tag --merged HEAD --sort=-version:refname)

          echo "ref=${previous_tag}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${previous_tag}" ]]; then
            echo "Comparing skill versions against ${previous_tag}."
          else
            echo "No previous release tag found; treating this as the first release."
          fi

      - name: Check skill version bumps
        if: steps.previous-release.outputs.ref != ''
        env:
          SKILL_VERSION_STRICT: '1'
          SKILL_VERSION_BASE_REF: ${{ steps.previous-release.outputs.ref }}
        run: npm run check:skill-versions -- --strict

      - name: Record first-release version check
        if: steps.previous-release.outputs.ref == ''
        run: echo "Skipping version comparison because no previous release tag exists."

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Run Gitleaks CLI
        run: |
          go install github.com/gitleaks/gitleaks/v8/cmd/gitleaks@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-git --redact --verbose

      - name: Generate catalogs
        run: npm run catalog:generate

      - name: Generate release notes
        run: npm run release:notes -- "${GITHUB_REF_NAME}"

      - name: Build release archive
        run: |
          mkdir -p dist
          zip -r "dist/llm-wiki-skills-${GITHUB_REF_NAME}.zip" \
            README.md \
            AGENTS.md \
            CLAUDE.md \
            CONTRIBUTING.md \
            SECURITY.md \
            LICENSE \
            CHANGELOG.md \
            skills.sh.json \
            skill-router.json \
            quality-baseline.json \
            package.json \
            package-lock.json \
            .markdownlint-cli2.jsonc \
            .github \
            policies \
            scripts \
            skills \
            docs \
            templates \
            domain-packs \
            benchmarks \
            examples \
            -x 'docs/assets/originals/*'

      - name: Extract release archive
        run: |
          mkdir -p "${RUNNER_TEMP}/release-archive"
          unzip -q "dist/llm-wiki-skills-${GITHUB_REF_NAME}.zip" -d "${RUNNER_TEMP}/release-archive"

      - name: Validate packaged archive
        working-directory: ${{ runner.temp }}/release-archive
        run: npm run validate

      - name: Smoke-test packaged archive
        working-directory: ${{ runner.temp }}/release-archive
        run: npm run smoke:skills

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            dist/llm-wiki-skills-${{ github.ref_name }}.zip
            dist/skills-catalog.json
            dist/release-notes-${{ github.ref_name }}.md
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/llm-wiki-skills-${GITHUB_REF_NAME}.zip" \
            dist/skills-catalog.json \
            "dist/release-notes-${GITHUB_REF_NAME}.md" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "dist/release-notes-${GITHUB_REF_NAME}.md"
