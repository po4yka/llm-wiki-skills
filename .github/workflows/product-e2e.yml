name: Product E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: product-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-starter:
    name: ${{ matrix.os }} / ${{ matrix.agent }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        agent: [claude-code, codex]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run product E2E
        env:
          E2E_AGENT: ${{ matrix.agent }}
        run: npm run test:product-e2e -- --agent "$E2E_AGENT"

      - name: Upload failed E2E workspace
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-e2e-${{ matrix.os }}-${{ matrix.agent }}
          path: ${{ runner.temp }}/llm-wiki-product-e2e-*/runner/vault
          if-no-files-found: ignore
          retention-days: 7
