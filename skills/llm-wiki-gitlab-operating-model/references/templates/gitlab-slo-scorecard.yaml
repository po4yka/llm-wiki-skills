  version: "0.1.0"
  generated_at: "YYYY-MM-DDTHH:MM:SSZ"
  gitlab_instance: ""
  top_level_group: ""
  review_period: monthly
  stage: pilot # pilot|early-production|business-critical|regulated-or-24x7

