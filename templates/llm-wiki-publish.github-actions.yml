name: llm-wiki-publish

on:
  pull_request:
    paths:
      - "wiki/**"
      - "exports/profiles/**"
      - "templates/export-profile.yaml"
      - "templates/agent-export-bundle.yaml"
      - "templates/static-site-export-profile.yaml"
      - ".github/workflows/llm-wiki-publish.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Export profile id
        required: true
        default: public-site
      publish:
        description: Publish after successful build
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate-export-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate export profiles
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema
          echo "Replace with scripts/validate_export_profile.py."
          test -f templates/export-profile.yaml

  build-export:
    runs-on: ubuntu-latest
    needs: validate-export-profile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml mkdocs mkdocs-material
          npm install -g pagefind

      - name: Build LLM-Wiki export
        run: |
          echo "Replace with scripts/build_export.py --profile ${{ github.event.inputs.profile || 'public-site' }}."
          mkdir -p exports/builds/public-site/latest/site exports/reports/public-site/latest
          echo "# LLM-Wiki Export" > exports/builds/public-site/latest/site/index.md
          echo "placeholder" > exports/builds/public-site/latest/llms.txt

      - name: Build static search index
        run: |
          echo "Replace with pagefind --site exports/builds/public-site/latest/site."

      - name: Validate export outputs
        run: |
          echo "Replace with link/citation/search-index/export-manifest validation."
          test -f exports/builds/public-site/latest/llms.txt

      - name: Generate checksums
        run: |
          find exports/builds -type f -print0 | sort -z | xargs -0 sha256sum > exports/builds/checksums.sha256

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-wiki-export
          path: |
            exports/builds/
            exports/reports/

  security-and-redaction:
    runs-on: ubuntu-latest
    needs: build-export
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download export artifact for security checks
        uses: actions/download-artifact@v4
        with:
          name: llm-wiki-export
          path: export-artifact

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Redaction/export policy gate
        run: |
          echo "::error::Replace this fail-closed placeholder with redaction checks over export-artifact."
          exit 1

  publish-pages:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    needs:
      - build-export
      - security-and-redaction
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Download export artifact
        uses: actions/download-artifact@v4
        with:
          name: llm-wiki-export
          path: export-artifact

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export-artifact/builds/public-site/latest/site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
